<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Lacquer Emerald Green Gradient -->
    <linearGradient id="glossyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d24" />
      <stop offset="50%" stop-color="#0e3a1a" />
      <stop offset="100%" stop-color="#051c0b" />
    </linearGradient>

    <!-- Warm Gold Radial Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C59B27" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C59B27" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Amber Whisky Gradient for Liquid -->
    <linearGradient id="whiskyLiquid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A05B17" />
      <stop offset="60%" stop-color="#D48A22" />
      <stop offset="100%" stop-color="#FFC04D" />
    </linearGradient>

    <!-- Clip Path for the Inside of the Tasting Glass Bowl (Sweet Spot Waist) -->
    <clipPath id="glassBowlClip">
      <path d="M 220 140 H 292 C 299 175, 326 215, 326 244 C 326 292, 294 322, 256 322 C 218 322, 186 292, 186 244 C 186 215, 213 175, 220 140 Z" />
    </clipPath>
  </defs>

  <!-- Outer Circle filled with Glossy Emerald Gradient (transparent corners) -->
  <circle cx="256" cy="256" r="244" fill="url(#glossyGreen)" />

  <!-- Center Golden Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#goldGlow)" />

  <!-- Scaling container to expand the artwork (reducing canvas padding) -->
  <g transform="translate(256, 256) scale(1.22) translate(-256, -256)">
    <!-- Filled Liquid showing a waving fluid line (clipped inside the tapered glass bowl) -->
    <g clip-path="url(#glassBowlClip)">
      <!-- Wavy Liquid Fill from bottom up to approx y=262 (golden ratio tasting pour level) -->
      <path 
        d="M 160 262 
           C 210 250, 240 278, 280 262 
           C 300 254, 320 258, 352 266 
           V 340 
           H 160 Z" 
        fill="url(#whiskyLiquid)" 
        opacity="0.85"
      />
    </g>

    <!-- Gold/Brass Outline Logo Glass (without outer circle border) -->
    <g fill="none" stroke="#C59B27" stroke-linecap="round" stroke-linejoin="round">
      <!-- Tapered Nosing Glass Bowl Outline (Bulbous Base, Perfect Sweet-Spot Tapered Neck) -->
      <path 
        d="M 220 140 
           H 292 
           C 299 175, 326 215, 326 244 
           C 326 292, 294 322, 256 322 
           C 218 322, 186 292, 186 244 
           C 186 215, 213 175, 220 140 Z" 
        stroke-width="16" 
      />

      <!-- Wavy Surface Highlights (matching liquid wave contour at y=263) -->
      <path 
        d="M 194 263 
           C 210 251, 240 277, 280 262 
           C 300 255, 310 258, 318 264" 
        stroke-width="12" 
        stroke-opacity="0.9"
      />

      <!-- Compact Curved Base/Pedestal -->
      <path 
        d="M 230 320 
           C 230 340 212 344 198 368 
           H 314 
           C 300 344 282 340 282 320" 
        stroke-width="16" 
      />
    </g>
  </g>
</svg>
